<!DOCTYPE html>
<html lang="en">

<head>
    <!--
        JavaScript Form Page
        Name: Alana Jacobs
        Student ID: 11820942
        Date: 17th May 2026
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatterFlow Digital | Newsletter Signup</title>

    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="../css/portfolio.css">

    <script>
        /* Displays welcome message when page loads */
        function showWelcomeMessage() {
            alert("Welcome to the MatterFlow Digital - Newsletter Signup");
        }

        /* Validates form before submission */
        function validateForm() {
            var firstName = document.getElementById("firstName").value;
            var lastName = document.getElementById("lastName").value;

            if (firstName.trim() === "") {
                alert("Please enter your first name.");
                return false;
            }

            if (lastName.trim() === "") {
                alert("Please enter your last name.");
                return false;
            }

            alert("Thank you for signing up to the MatterFlow Digital newsletter.");

            /* Closes the tab after successful submission */
            window.close();

            /* Prevents the page from refreshing */
            return false;
        }
    </script>
</head>

<body onload="showWelcomeMessage()">

    <div id="wrapper">

        <header class="company-header">
        </header>

        <main>

            <div class="form-container">

                <h1>Newsletter Signup</h1>

                <p>
                    Please complete the form below to receive updates from MatterFlow Digital.
                    Fields marked with an asterisk (*) are required.
                </p>

                <!-- HTML5 Form -->
                <form action="#"
                      method="post"
                      onsubmit="return validateForm()">

                    <label for="firstName">First Name *</label>
                    <input type="text"
                           id="firstName"
                           name="firstName"
                           maxlength="60"
                           required
                           placeholder="Enter your first name">

                    <label for="lastName">Last Name *</label>
                    <input type="text"
                           id="lastName"
                           name="lastName"
                           maxlength="60"
                           required
                           placeholder="Enter your last name">

                    <label for="email">Email Address *</label>
                    <input type="email"
                           id="email"
                           name="email"
                           maxlength="60"
                           required
                           placeholder="example@email.com">

                    <fieldset>
                        <legend>Age Range</legend>

                        <label>
                            <input type="radio" name="age" value="15-25">
                            15-25
                        </label>

                        <label>
                            <input type="radio" name="age" value="26-35">
                            26-35
                        </label>

                        <label>
                            <input type="radio" name="age" value="36-45">
                            36-45
                        </label>

                        <label>
                            <input type="radio" name="age" value="46-55">
                            46-55
                        </label>

                        <label>
                            <input type="radio" name="age" value="55+">
                            55+
                        </label>
                    </fieldset>

                    <fieldset>
                        <legend>Services of Interest</legend>

                        <label>
                            <input type="checkbox" name="service" value="implementation">
                            Implementation Services
                        </label>

                        <label>
                            <input type="checkbox" name="service" value="migration">
                            Data Migration
                        </label>

                        <label>
                            <input type="checkbox" name="service" value="training">
                            Staff Training
                        </label>

                        <label>
                            <input type="checkbox" name="service" value="automation">
                            Workflow Automation
                        </label>

                        <label>
                            <input type="checkbox" name="service" value="ai">
                            AI Automation
                        </label>
                    </fieldset>

                    <label for="comments">Questions or Comments</label>
                    <textarea id="comments"
                              name="comments"
                              cols="60"
                              rows="3"
                              placeholder="Enter your comments here"></textarea>

                    <div class="form-buttons">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </div>

                </form>

            </div>

        </main>

    </div>

</body>
</html>
